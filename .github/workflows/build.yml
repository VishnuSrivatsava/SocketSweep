name: Build SocketSweep

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      # Pin Google Platform-Tools archives and verify their bytes before unpacking.
      matrix:
        include:
          # Linux builds on the oldest still-supported Ubuntu LTS so the
          # bundled glibc requirement stays low (2.35 on jammy) and the
          # AppImage runs on older distributions — required by the AppImage
          # catalog ("error-glibc-too-new" otherwise).
          - os: ubuntu-22.04
            platform: linux
            installer_artifact: SocketSweep-Linux
            installer_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.zsync
            adb_url: https://dl.google.com/android/repository/platform-tools_r37.0.1-linux.zip
            adb_sha256: d230f13842f60f782a8645f9c813f8f845bf36089ea7289f28c48f17979313f1
          - os: macos-latest
            platform: macos
            installer_artifact: SocketSweep-macOS
            installer_paths: src-tauri/target/release/bundle/dmg/*.dmg
            adb_url: https://dl.google.com/android/repository/platform-tools_r37.0.1-darwin.zip
            adb_sha256: ee39ad5967e95c2a07f04dbcbde96b1a0c916ba376096db5d2f498b7727a5d1d
          - os: windows-latest
            platform: windows
            installer_artifact: SocketSweep-Windows
            installer_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
            adb_url: https://dl.google.com/android/repository/platform-tools_r37.0.1-win.zip
            adb_sha256: 45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── System dependencies (Linux only) ──────────────────────────────────
      # Tauri v2 requires GTK, WebKit, and related libraries on Linux.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            zsync

      # ── Toolchain setup ───────────────────────────────────────────────────
      # Rust is pre-installed on all GitHub Actions runners (ubuntu, windows,
      # macos). No need for dtolnay/rust-toolchain — saves CI time.
      # See: https://github.com/actions/runner-images
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Per-image cache: artifacts restored across different runner
          # images (e.g. 24.04 -> 22.04) can be silently stale and fail
          # with E0463 "can't find crate" despite matching fingerprints.
          key: ${{ matrix.os }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend helpers
        run: npm test

      - name: Lint frontend and fixtures
        run: npm run lint

      - name: Test benchmark tools offline on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p 'test_*benchmark.py' -v

      - name: Test daemon protocol on host
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tests -v

      - name: Test root scans in a disposable Linux filesystem
        if: runner.os == 'Linux'
        run: |
          sudo -n env CXX=g++ python3 -m unittest discover -s tests -p test_root_scan.py -v
          sudo -n env CXX=g++ python3 -m unittest discover -s tests -p test_owned_session.py -v

      - name: Cross-compile C++ daemons
        shell: python {0}
        run: |
          import subprocess
          import sys
          for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64"):
              subprocess.run([
                  sys.executable, "engine/build_daemon.py", "--abi", abi,
                  "--platform", "${{ matrix.platform }}", "--commit", "${{ github.sha }}",
              ], check=True)

      # Keep symbols outside Tauri resources. Each host build can use a
      # different NDK; the manifest identifies its exact stripped daemon.
      - name: Upload matching daemon symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daemon-symbols-${{ matrix.platform }}-android-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: daemon-symbols/
          if-no-files-found: error
          retention-days: 90

      # ── Download platform-specific ADB from Google ────────────────────────
      - name: Download ADB (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL -o platform-tools.zip "${{ matrix.adb_url }}"
          echo "${{ matrix.adb_sha256 }}  platform-tools.zip" | shasum -a 256 -c -
          unzip -qo platform-tools.zip
          cp platform-tools/adb src-tauri/bin/adb
          chmod +x src-tauri/bin/adb
          rm -rf platform-tools platform-tools.zip
          echo "✓ ADB binary ready for ${{ matrix.platform }}"

      - name: Download ADB (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ matrix.adb_url }}" -OutFile platform-tools.zip
          $hash = (Get-FileHash -Algorithm SHA256 platform-tools.zip).Hash
          if ($hash -ne "${{ matrix.adb_sha256 }}") {
            throw "Android Platform-Tools archive SHA-256 mismatch"
          }
          Expand-Archive platform-tools.zip -DestinationPath . -Force
          Copy-Item platform-tools\adb.exe         src-tauri\bin\adb.exe
          Copy-Item platform-tools\AdbWinApi.dll    src-tauri\bin\AdbWinApi.dll
          Copy-Item platform-tools\AdbWinUsbApi.dll src-tauri\bin\AdbWinUsbApi.dll
          Remove-Item -Recurse -Force platform-tools, platform-tools.zip
          Write-Host "✓ ADB binaries ready for Windows"

      - name: Update version from Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: node {0}
        run: |
          const fs = require('fs');
          const tag = process.env.GITHUB_REF_NAME;
          const version = tag.startsWith('v') ? tag.slice(1) : tag;
          
          // Update package.json
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          
          // Update tauri.conf.json
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          tauri.version = version;
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
          
          console.log(`Successfully bumped version to ${version} inside CI environment`);

      # ── Build Tauri desktop app ───────────────────────────────────────────
      # This single command builds the React frontend (beforeBuildCommand),
      # compiles the Rust bridge, and packages everything into native
      # platform installers (.dmg / .deb / .AppImage / .msi / .exe).
      - name: Build Tauri app
        run: npm run tauri -- build --verbose

      - name: Test Rust bridge
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Test built scan UI with mocked IPC
        if: runner.os == 'Linux'
        run: |
          python3 tests/check_scan_ui.py
          UI_TEST_WINDOW=1024,768 python3 tests/check_scan_ui.py
          UI_TEST_SCALE=2 python3 tests/check_scan_ui.py

      # ── Fix AppImage: guarantee root icon + .DirIcon + sane modes ─────────
      # Required for AppImage catalog validation. tauri-bundler 2.11.1 emits a
      # .DirIcon whose target is an ABSOLUTE path into the build machine
      # (dangling everywhere else — the .desktop symlink IS relative since
      # bundler 2.9.4, but .DirIcon is not fixed), and its AppDir carries
      # root-only directory modes (0700 dirs, 0770 AppRun.wrapped) that make
      # the packed image unexecutable for non-root users. We extract, fix the
      # root icon + .DirIcon + permissions, repack with a pinned
      # checksum-verified appimagetool, and verify the stored squashfs modes.
      - name: Fix AppImage and enable delta updates
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          [ -n "$APPIMAGE" ] || { echo "::error::No AppImage found in src-tauri/target/release/bundle/appimage"; exit 1; }
          APPIMAGE=$(realpath "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          # The AppImage runtime itself handles extraction (no FUSE needed).
          # --appimage-extract always outputs to ./squashfs-root/
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          APPDIR="$(pwd)/squashfs-root"

          echo "AppDir contents:"
          ls -la "$APPDIR"

          # Guarantee the root icon (.DirIcon must resolve to a real file).
          # Prefer the productName-named png (matches Icon= in the desktop
          # file); the bundler may also place one named after the binary
          # (tauri-app.png), which find would otherwise pick first.
          ICON=$(find "$APPDIR" -maxdepth 1 -name "SocketSweep.png" | head -1)
          if [ -z "$ICON" ]; then
            ICON=$(find "$APPDIR" -maxdepth 1 -name "*.png" | head -1)
          fi
          if [ -z "$ICON" ]; then
            cp src-tauri/icons/128x128.png "$APPDIR/SocketSweep.png"
            ICON="$APPDIR/SocketSweep.png"
          fi
          ICON_NAME=$(basename "$ICON")
          echo "Linking .DirIcon -> $ICON_NAME"
          ln -sf "$ICON_NAME" "$APPDIR/.DirIcon"

          # Normalize permissions before repacking. The AppDir produced by
          # tauri-bundler 2.11.1 contains root-only directory modes (AppDir
          # root, usr/ and apprun-hooks/ are 0700; AppRun.wrapped is 0770).
          # Squashfs preserves them, so the app is unexecutable for every
          # non-root user — the AppImage catalog's firejail run fails with
          # "AppRun: Permission denied" and desktop users would hit the same.
          # Dirs must be traversable, everything readable, and binaries,
          # libraries, resources (usr/bin, usr/lib incl. bundled adb/daemon)
          # and AppRun hooks executable.
          find "$APPDIR" -type d -exec chmod 755 {} +
          find "$APPDIR" -type f -exec chmod 644 {} +
          chmod 755 "$APPDIR/AppRun"
          if [ -e "$APPDIR/AppRun.wrapped" ]; then
            chmod 755 "$APPDIR/AppRun.wrapped"
          fi
          if [ -d "$APPDIR/apprun-hooks" ]; then
            find "$APPDIR/apprun-hooks" -type f -exec chmod 755 {} +
          fi
          find "$APPDIR/usr/bin" "$APPDIR/usr/lib" -type f -exec chmod 755 {} +

          # Assert the modes we control on-disk before packing. mksquashfs
          # stores disk modes verbatim, so these are what the image carries.
          assert_mode() { [ "$(stat -c '%a' "$2")" = "$1" ] || { echo "::error::$2 mode is $(stat -c '%a' "$2"), expected $1"; exit 1; }; }
          assert_mode 755 "$APPDIR"
          assert_mode 755 "$APPDIR/usr"
          assert_mode 755 "$APPDIR/AppRun"
          if [ -e "$APPDIR/AppRun.wrapped" ]; then
            assert_mode 755 "$APPDIR/AppRun.wrapped"
          fi
          assert_mode 755 "$APPDIR/usr/lib/SocketSweep/bin/adb"
          for daemon in daemon daemon-armeabi-v7a daemon-x86 daemon-x86_64; do
            assert_mode 644 "$APPDIR/usr/share/SocketSweep/bin/$daemon"
            cmp "src-tauri/bin/$daemon" "$APPDIR/usr/share/SocketSweep/bin/$daemon"
          done

          # Download appimagetool for repacking — pinned to 1.9.1 and
          # checksum-verified (GitHub "continuous" builds are unpinned, and
          # AppImageKit's own releases are marked obsolete).
          # Use --appimage-extract-and-run because GitHub Actions has no FUSE.
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | shasum -a 256 -c -
          chmod +x appimagetool
          APPIMAGETOOL="$(pwd)/appimagetool"

          # Match the versioned Tauri asset name, and follow published stable
          # releases rather than a fixed tag. Derive the repository so forks
          # do not inadvertently update from the upstream project's releases.
          UPDATE_INFO="gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY#*/}|latest|SocketSweep_*_amd64.AppImage.zsync"

          # Repack in place. appimagetool embeds update information and then
          # generates the sidecar from the FINAL image (including its digest).
          # Remove any cached sidecar so a skipped generation cannot pass CI.
          rm -f "$APPIMAGE.zsync"
          # zsyncmake writes basename(AppImage).zsync in its working directory,
          # so pack from the bundle directory to keep both release assets there.
          (
            cd "$(dirname "$APPIMAGE")"
            ARCH=x86_64 "$APPIMAGETOOL" --appimage-extract-and-run \
              --updateinformation "$UPDATE_INFO" "$APPDIR" "$APPIMAGE"
          )

          [ "$("$APPIMAGE" --appimage-updateinformation)" = "$UPDATE_INFO" ] || { echo "::error::AppImage update information does not match"; exit 1; }
          [ -s "$APPIMAGE.zsync" ] || { echo "::error::AppImage zsync sidecar is missing or empty"; exit 1; }
          # Verify the sidecar resolves the sibling release asset and describes
          # its exact bytes, not a pre-repack or cached AppImage.
          python3 - "$APPIMAGE" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          image = Path(sys.argv[1])
          header = Path(str(image) + ".zsync").read_bytes().split(b"\n\n", 1)[0]
          fields = dict(line.split(": ", 1) for line in header.decode("utf-8").splitlines())
          expected = {
              "Filename": image.name,
              "URL": image.name,
              "Length": str(image.stat().st_size),
              "SHA-1": hashlib.sha1(image.read_bytes()).hexdigest(),
          }
          for key, value in expected.items():
              if fields.get(key) != value:
                  sys.exit(f"::error::AppImage zsync {key} does not match the final image")
          print("AppImage zsync filename, URL, size, and checksum verified")
          PY

          # Verify the repacked image the way the AppImage catalog does:
          # .DirIcon (and the root .desktop, when present) must resolve —
          # test -e follows symlinks, so dangling ones fail here in CI
          # instead of in the catalog PR.
          # Verify the packed image by re-extracting and resolving the root
          # symlinks. Note: the runtime extractor creates ALL directories as
          # 0700 regardless of stored modes and umask (proven empirically), so
          # extracted dir modes are meaningless here — the stored dir modes are
          # guaranteed by the pre-pack assertions above plus mksquashfs storing
          # disk modes verbatim, and are spot-checked with 7z on the uploaded
          # asset outside CI.
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract >/dev/null
          [ -e "$APPDIR/.DirIcon" ] || { echo "::error::.DirIcon is dangling after repack"; exit 1; }
          echo ".DirIcon -> $(readlink "$APPDIR/.DirIcon") (resolves OK)"
          DESKTOP=$(find "$APPDIR" -maxdepth 1 -name "*.desktop" | head -1)
          if [ -n "$DESKTOP" ] && [ ! -e "$DESKTOP" ]; then
            echo "::error::Root .desktop symlink is dangling after repack"
            exit 1
          fi

          rm -rf squashfs-root appimagetool
          echo "✓ AppImage patched with .DirIcon and verified"

      # ── Upload release artifacts ──────────────────────────────────────────
      - name: Verify installer outputs
        shell: python
        env:
          INSTALLER_PATHS: ${{ matrix.installer_paths }}
        run: |
          import os
          from pathlib import Path

          for pattern in os.environ["INSTALLER_PATHS"].splitlines():
              files = list(Path.cwd().glob(pattern))
              if not files:
                  raise SystemExit(f"Missing installer output: {pattern}")
              for path in files:
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(f"Empty or invalid installer output: {path}")

      - name: Upload installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.installer_artifact }}
          path: ${{ matrix.installer_paths }}
          if-no-files-found: error

  # ── Create GitHub Release (only on tag push) ─────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: 'SocketSweep-*'

      - name: Display downloaded files
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: false
          files: |
            artifacts/SocketSweep-Windows/**/*
            artifacts/SocketSweep-Linux/**/*
            artifacts/SocketSweep-macOS/**/*
